# DEMONSTRACAO SENAI: MySQL Server instalado no Windows, administrado pelo Workbench.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: "jdbc:mysql://host.docker.internal:3306/metaltech?useSSL=false&allowPublicKeyRetrieval=true"
      DB_USER: "${DB_USER:-root}"
      DB_PASSWORD: "${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}"
      INGEST_API_KEY: "${INGEST_API_KEY:?Configure INGEST_API_KEY no arquivo .env}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?Configure ADMIN_API_KEY no arquivo .env}"
      TANK_EMPTY_RAW: "${TANK_EMPTY_RAW:-817}"
      TANK_FULL_RAW: "${TANK_FULL_RAW:-80}"
      TANK_STALE_SECONDS: "10"
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8080:8080"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["127.0.0.1:8081:80"]
  ar:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./ar:/usr/share/nginx/html/ar:ro
      - ./infrastructure/nginx-ar.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    ports: ["127.0.0.1:8082:80"]
